name: Pipeline validation
on:
  push:
    paths-ignore:
      - 'Class 6th Science/**'
      - 'Class 7th Science/**'
      - 'Class 8th Science/**'
      - 'Science-notes-links.xlsx'
  pull_request:
    paths-ignore:
      - 'Class 6th Science/**'
      - 'Class 7th Science/**'
      - 'Class 8th Science/**'
      - 'Science-notes-links.xlsx'
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            Final-lyx_template
            stage0
            stage1
            stage2
            tests
            AGENTS.md
            CLAUDE.md
            HANDOFF.md
            README.md
            requirements.txt
            pytest.ini
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  compiler-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            Final-lyx_template
            stage0
            stage1
            stage2
            tests
            AGENTS.md
            CLAUDE.md
            HANDOFF.md
            README.md
            requirements.txt
            pytest.ini
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y lyx texlive-latex-extra texlive-fonts-extra texlive-science poppler-utils
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -m integration --basetemp="$RUNNER_TEMP/ci-integration"
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compiler-diagnostics
          path: ${{ runner.temp }}/ci-integration
